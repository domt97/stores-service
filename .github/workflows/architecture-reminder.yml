name: Architecture docs reminder

# Comments once on a PR that changes the service's contract surface
# (REST, messaging, events, outbound clients, DB migrations), reminding to
# update the system map in domt97/oms-workspace.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/main/java/**/infrastructure/rest/**"
      - "src/main/java/**/infrastructure/message/**"
      - "src/main/java/**/domain/event/**"
      - "src/main/java/**/application/event/**"
      - "src/main/java/**/application/client/**"
      - "src/main/java/**/domain/model/**"
      - "src/main/resources/db/migration/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- architecture-reminder -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number });
            const groups = {
              'REST endpoints': /infrastructure\/rest\//,
              'Kafka / SQS consumers': /infrastructure\/message\//,
              'Published events (outbox)': /(domain|application)\/event\//,
              'Calls to other services': /application\/client\//,
              'Aggregates / domain model': /domain\/model\//,
              'Database migrations': /db\/migration\//,
            };
            const hits = Object.entries(groups)
              .map(([name, re]) => [name, files.filter(f => re.test(f.filename)).map(f => f.filename)])
              .filter(([, list]) => list.length);
            if (!hits.length) return;

            const body = [
              marker,
              '### 🗺️ Architecture docs check',
              'This PR touches the service contract surface:',
              '',
              ...hits.map(([name, list]) => `- **${name}**: ${list.length} file(s)`),
              '',
              'If it adds or changes an endpoint, event, consumer, table or aggregate, update in the same piece of work:',
              '- `domt97/oms-workspace` → `architecture/domain-map.md`, `architecture/integration.md`, relevant `architecture/flows/`',
              '- this repo\'s `CLAUDE.md` (layout, checklist, known gaps)',
              '',
              '_`architecture/generated/` in oms-workspace refreshes daily from `develop`; a weekly Claude task reconciles the hand-written docs._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
