name: Delete merged branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.payload.pull_request.head.ref;

            // Protected branches that must never be deleted
            const protectedBranches = [
              "main",
              "master",
              "develop"
            ];

            if (protectedBranches.includes(head)) {
              console.log(`Skip protected branch: ${head}`);
              return;
            }

            if (head.startsWith("release/")) {
              console.log(`Skip release branch: ${head}`);
              return;
            }

            // Delete any other merged branch regardless of naming convention
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${head}`
            });

            console.log(`Deleted ${head}`);
