server:
  port: 8048

spring:
  application:
    name: stores-service

  datasource:
    url: jdbc:postgresql://localhost:5432/store?currentSchema=store
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        query:
          in_clause_parameter_padding: true
        show_sql: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/store?currentSchema=store
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

aws:
  # For local development with LocalStack
  # endpoint: http://localhost:4566
  region: ${AWS_REGION:eu-west-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY:test}
  secret-key: ${AWS_SECRET_KEY:test}

  s3:
    store-product-bucket: ${AWS_S3_STORE_PRODUCT_BUCKET:store-products}

app:
  # Excel product import limits (BR-CAT-13); see ProductImportLimits for the meaning of each value.
  import:
    max-bytes: ${IMPORT_MAX_BYTES:5242880}
    max-products: ${IMPORT_MAX_PRODUCTS:1000}
    max-skus: ${IMPORT_MAX_SKUS:10000}
    max-images: ${IMPORT_MAX_IMAGES:20000}
    row-element-factor: 10
    max-shared-strings: 200000
    max-text-chars: 20000000
    max-cell-chars: 10000
    max-styles-bytes: 5242880
    max-zip-entry-bytes: 16777216
    min-inflate-ratio: 0.01
    permits: ${IMPORT_PERMITS:0}            # 0 = from the heap: one slot per heap-per-import-bytes, one kept free
    max-permits: ${IMPORT_MAX_PERMITS:4}
    max-waiting: 20
    heap-per-import-bytes: 134217728
    slot-wait-seconds: 40
    retry-after-seconds: 10
  swagger:
    title: Store Service API
    version: v1
    description: Store service REST API

logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
        orm:
          jdbc:
            bind: OFF