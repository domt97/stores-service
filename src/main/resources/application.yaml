server:
  port: 8048

spring:
  application:
    name: stores-service

  datasource:
    url: jdbc:postgresql://localhost:5432/store?currentSchema=store
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        query:
          in_clause_parameter_padding: true
        show_sql: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/store?currentSchema=store
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

aws:
  # For local development with LocalStack
  # endpoint: http://localhost:4566
  region: ${AWS_REGION:eu-west-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY:test}
  secret-key: ${AWS_SECRET_KEY:test}

  dynamodb:
    table:
      tenant-info: ${AWS_DYNAMODB_TABLE:tenant_info}
  s3:
    store-product-bucket: ${AWS_S3_STORE_PRODUCT_BUCKET:store-products}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    enabled: true

logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: OFF
        orm:
          jdbc:
            bind: OFF